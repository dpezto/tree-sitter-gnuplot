name: CI

on:
  push:
    branches: [main]
    paths:
      - grammar.js
      - queries/**
      - src/**
      - test/**
      - scripts/**
      - keywords.json
      - bindings/**
      - binding.gyp
      - Cargo.toml
      - go.mod
      - go.sum
      - package.json
      - package-lock.json
      - pyproject.toml
      - .github/workflows/ci.yml
  # No path filter: `test` and `coverage` are required checks, so every PR must
  # be able to report them. A filtered pull_request trigger leaves PRs that
  # touch only unlisted paths (workflows, queries, docs) permanently unmergeable.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: reviewdog/action-actionlint@50842263c20a7c46bd0065b9e624d3c569db061e # v1

  keywords:
    # keywords.json is generated from src/scanner.c + grammar.js by
    # scripts/gen-keywords.mjs (consumed by downstream tooling, e.g. an LSP).
    # Regex-mining C fails silently when a table is renamed/reshaped, so the
    # committed file must always match a fresh run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # full history: the generator mines the pre-redesign grammar
          # revision (git show <rev>:grammar.js) for the option-parent map
          fetch-depth: 0
      - name: Regenerate keyword dictionary
        run: node scripts/gen-keywords.mjs
      - name: Check keywords.json is current
        run: git diff --exit-code keywords.json

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: tree-sitter/setup-action/cli@v2
      - uses: tree-sitter/parser-test-action@v3
        # This action always runs the generate-diff check + the corpus test
        # (`tree-sitter test`, 107 cases) on every OS; the test-<lang> flags gate
        # only the per-binding load smoke tests.
        with:
          test-rust: true
          test-go: true
          # Load smoke tests for node/python/swift are off; the binding builds
          # themselves are fixed (scanner.c now compiled, index.js back to CJS).
          # Remaining blockers before re-enabling each:
          # - node:   parser regenerates at ABI 15 but the `tree-sitter` node
          #           peerDependency is ^0.21 (ABI <=14) -> setLanguage throws
          #           in initializeLanguageNodeClasses. Needs peer bump to an
          #           ABI-15 runtime (>=0.25) + node-addon-api 8; verify native
          #           builds on all 3 OS.
          # - python: needs verification against tree_sitter ~=0.24.
          # - swift:  Package.swift test target references SwiftTreeSitter with no
          #           explicit `.product(name:package:)` declaration.
          # nvim-treesitter consumes the C parser, not these bindings; registry
          # publishing is independent of these smoke tests.
          test-node: false
          test-python: false
          test-swift: false
      - name: Oracle parse (synthetic full-length script)
        # test/oracle/synthetic.plt mirrors the statement mix of a real-world
        # script and contains exactly one deliberately-invalid line (the
        # contourfill doc-defect shape, marked "INTENTIONALLY INVALID:").
        # Everything else must parse without ERROR/MISSING; this guards
        # error-recovery behavior on whole-file input, which single-construct
        # corpus cases do not exercise. The expected ERROR row is derived from
        # the marker comment, so the file can grow without editing this step.
        shell: bash
        run: |
          tree=$(tree-sitter parse test/oracle/synthetic.plt || true)
          body=$(grep -v 'Parse:' <<<"$tree")
          row=$(( $(grep -n 'INTENTIONALLY INVALID:' test/oracle/synthetic.plt | cut -d: -f1) - 1 ))
          test "$(grep -c '(ERROR ' <<<"$body")" -eq 1
          grep -q "(ERROR \[$row, " <<<"$body"
          ! grep -q 'MISSING' <<<"$body"

  metadata:
    # package.json had no `repository` field, so npm refused the 4.0.0 upload
    # with E422 after the provenance statement had already been logged; and
    # tree-sitter.json's metadata.version sat at 2.0.1 for three releases
    # because it was not in release-please's extra-files. Both were invisible
    # until a release exercised them. This asserts them on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check project metadata
        run: node scripts/check-metadata.mjs

  queries:
    # `tree-sitter query` only proves the query PARSES, and it evaluates
    # `#match?` with Rust regex. Neovim evaluates those predicates through
    # Vim's NFA engine instead: different syntax, and a hard cap of 9 capturing
    # groups. A query that passes the CLI can still abort at runtime with
    # `E872: (NFA regexp) Too many '('`, which silently leaves everything after
    # the failing predicate unhighlighted. Only a real editor run catches that
    # class, so highlights.scm is exercised under headless Neovim here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install tree-sitter-cli
        run: npm install -g tree-sitter-cli@0.26.11
      - name: Build parser
        run: tree-sitter build --output gnuplot.so .
      - name: Install Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
      - name: Highlight the oracle script under Neovim
        run: nvim --headless --clean -l test/highlight-check.lua gnuplot.so

  coverage:
    # Scanner line coverage → Codecov. Only src/scanner.c is reported; parser.c
    # is generated (ignored in codecov.yml). Kept as a dedicated job because it
    # needs a custom --coverage build the matrix test action does not do.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install tree-sitter-cli
        run: npm install -g tree-sitter-cli@0.26.11
      - name: Generate parser
        run: tree-sitter generate
      - name: Run tests with coverage instrumentation
        run: tree-sitter test
        env:
          CFLAGS: --coverage -O0
      - name: Generate gcov report for scanner
        # tree-sitter builds the parser in ~/.cache/tree-sitter/lib; the .gcno
        # files reference src/scanner.c relative to the repo root, so gcov must
        # run from here. parser.c is generated, so only the scanner is reported.
        run: gcov ~/.cache/tree-sitter/lib/*-scanner.gcda
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./scanner.c.gcov
          disable_search: true
          fail_ci_if_error: false
