name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # release-please opens/updates a release PR (CHANGELOG + version bump across all
  # manifests via .release-please-config.json extra-files). Merging that PR sets
  # release_created and creates the tag + GitHub Release in this same run.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Mint a GitHub App token so release-please's PRs/tags are created as the
      # App, not GITHUB_TOKEN. GITHUB_TOKEN-created PRs cannot trigger CI, so the
      # release PR otherwise has no status checks and can't satisfy branch
      # protection (needed admin-merge). The App token makes the release PR
      # trigger CI and auto-merge normally.
      - uses: actions/create-github-app-token@v3
        id: app-token
        # Tolerate missing App secrets: fall back to GITHUB_TOKEN below (release
        # still works, but the release PR won't get CI and needs an admin merge).
        continue-on-error: true
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_KEY }}
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  # Registry publish is gated in THIS run, not a separate tag-triggered workflow:
  # a tag pushed by the default GITHUB_TOKEN cannot trigger another workflow.
  # Local OIDC-enabled copy of package-npm.yml (see the pypi job below and
  # tree-sitter/workflows#54). No NODE_AUTH_TOKEN passed -> npm publishes via
  # the OIDC id-token.
  npm:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/package-npm.yml
    with:
      generate: true

  # Local OIDC-enabled copy of package-crates.yml. No CARGO_REGISTRY_TOKEN
  # passed -> crates-io-auth-action mints a short-lived token via OIDC.
  crates:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/package-crates.yml
    # generate:false — the committed src/ is complete and tracked, so cargo
    # publishes from it directly. generate:true made the job cargo-install the
    # CLI into an in-workspace CARGO_HOME, whose .crates.toml/.crates2.json then
    # tripped `cargo publish`'s uncommitted-changes check.
    with:
      generate: false

  # Local copy of tree-sitter/workflows' package-pypi.yml, patched for OIDC
  # trusted publishing (upstream PR tree-sitter/workflows#54, unmerged). No
  # PYPI_API_TOKEN passed -> gh-action-pypi-publish authenticates via the OIDC
  # id-token. Re-sync the vendored file if the upstream build matrix changes.
  pypi:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/package-pypi.yml
    with:
      generate: true

  # The publish step lives here, not in package-pypi.yml, because PyPI matches a
  # trusted publisher against the job_workflow_ref claim — the file holding the
  # publishing job. Inside a reusable workflow that claim names package-pypi.yml,
  # and PyPI does not accept a reusable workflow as a publisher (warehouse#11096),
  # which is what produced `invalid-publisher` on the 3.0.0 release. Only this job
  # moved up; sdist and wheel building stay in package-pypi.yml, whose artifacts
  # are scoped to the run and so download here unchanged. The release_created
  # gate is stated explicitly rather than left to skip-propagation from `pypi`,
  # so the condition survives an edit to that job. Register the publisher as
  # workflow `release.yml`, environment `pypi`, matching the declaration below.
  pypi-publish:
    name: Publish Python package
    needs: [release-please, pypi]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tree-sitter-gnuplot/
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Check build artifacts
        run: ls -l dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{secrets.PYPI_API_TOKEN}}
