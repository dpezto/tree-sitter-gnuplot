# Vendored from tree-sitter/workflows/.github/workflows/package-pypi.yml, build
# jobs only. Upstream's `package` job is deliberately ABSENT: PyPI matches a
# trusted publisher against job_workflow_ref, so a publish running here would
# present this file rather than release.yml, and PyPI does not accept a reusable
# workflow as a publisher (warehouse#11096). The publish job lives in
# release.yml as `pypi-publish` and downloads the `dist-*` artifacts these jobs
# upload. Do NOT restore `package` when re-syncing from upstream — that
# reintroduces the `invalid-publisher` failure seen on the 3.0.0 release.
# `workflow_call` only, so it never runs on its own.
#
# The package-name and environment-name inputs are gone with the publish job:
# an environment-name that no longer selects the deployment environment would
# be a silent no-op on a security boundary. Both now live in release.yml.
# PYPI_API_TOKEN is declared but inert here; the rollback to classic token auth
# is the same secret consumed by release.yml's pypi-publish job.
name: Publish package (pypi)

on:
  workflow_call:
    inputs:
      python-version:
        description: The Python version
        default: ${{vars.PYTHON_VERSION || '3.11'}}
        type: string
      generate:
        description: Generate the parser artifacts
        default: false
        type: boolean
      abi-version:
        description: The tree-sitter ABI version
        default: 15
        type: number
    secrets:
      # Optional: unset -> OIDC trusted publishing; set -> classic token (rollback)
      PYPI_API_TOKEN:
        description: An authentication token for pypi
        required: false

jobs:
  build_sdist:
    name: Build source dist
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{inputs.python-version}}
      - name: Set up tree-sitter CLI
        if: ${{inputs.generate}}
        uses: tree-sitter/setup-action/cli@v2
      - name: Install dependencies
        run: |-
          if jq -e "$JQ_SCRIPT" package.json >/dev/null; then
            npm i --ignore-scripts --omit peer --omit optional
          fi
        env:
          JQ_SCRIPT: >-
            .dependencies + .devDependencies |
            with_entries(select(
            (.key | startswith("tree-sitter-"))
            and (.key != "tree-sitter-cli")
            )) | length > 0
      - name: Regenerate parser
        if: ${{inputs.generate}}
        shell: bash
        run: |
          while read -r grammar_dir; do
            pushd "$grammar_dir"
            tree-sitter generate
            popd > /dev/null
          done < <(jq -r '.grammars[].path // "."' tree-sitter.json)
        env:
          TREE_SITTER_ABI_VERSION: ${{inputs.abi-version}}
      - name: Install dependencies
        run: pip install --upgrade pip build setuptools wheel
      - name: Build sources
        run: python -mbuild -n -s
      - name: Upload sources
        uses: actions/upload-artifact@v7
        with:
          name: dist-sources
          path: dist/*.tar.gz
          retention-days: 2

  build_wheels:
    name: Build wheels on ${{matrix.os}}
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os:
          - windows-2025
          - windows-11-arm
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up tree-sitter CLI
        if: ${{inputs.generate}}
        uses: tree-sitter/setup-action/cli@v2
      - name: Install dependencies
        shell: bash
        run: |-
          if jq -e "$JQ_SCRIPT" package.json >/dev/null; then
            npm i --ignore-scripts --omit peer --omit optional
          fi
        env:
          JQ_SCRIPT: >-
            .dependencies + .devDependencies |
            with_entries(select(
            (.key | startswith("tree-sitter-"))
            and (.key != "tree-sitter-cli")
            )) | length > 0
      - name: Regenerate parser
        if: ${{inputs.generate}}
        shell: bash
        run: |
          while read -r grammar_dir; do
            grammar_dir="${grammar_dir%$'\r'}"
            pushd "$grammar_dir"
            tree-sitter generate
            popd > /dev/null
          done < <(jq -r '.grammars[].path // "."' tree-sitter.json)
        env:
          TREE_SITTER_ABI_VERSION: ${{inputs.abi-version}}
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1
        with:
          output-dir: dist
        env:
          CIBW_ARCHS: native
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.whl
          name: dist-wheels-${{matrix.os}}
          retention-days: 2
